kind: PersistentVolumeClaim
metadata:
  name: fast-food-mongodb-data
  namespace: quickbite
  labels:
    app: fast-food-mongodb
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
