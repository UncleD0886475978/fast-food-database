apiVersion: v1
kind: Service
metadata:
  name: fast-food-mongodb
  namespace: quickbite
  labels:
    app: fast-food-mongodb
spec:
  type: ClusterIP
  selector:
    app: fast-food-mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: fast-food-mongodb-headless
  namespace: quickbite
  labels:
    app: fast-food-mongodb
spec:
  clusterIP: None
  selector:
    app: fast-food-mongodb
  ports:
    - port: 27017
      targetPort: 27017
