# EXAMPLE — ./setup.sh k8s copies this to secret.yaml for you.
# CHANGE ME: replace this password before using anywhere real.
# DB_USER becomes MongoDB's admin (root) user, auth database "admin".
apiVersion: v1
kind: Secret
metadata:
  name: fast-food-mongodb
  namespace: quickbite
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: quickbite
  MONGO_INITDB_ROOT_PASSWORD: quickbite_change_me
  MONGO_INITDB_DATABASE: quickbite
